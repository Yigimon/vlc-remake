# Windows build of the redesign (win64, Qt interface)
#
# Cross-compiles VLC like the upstream CI does (see extras/ci/gitlab-ci.yml,
# "win64" / "nightly-win64" jobs): same Docker image, prebuilt contribs,
# autotools build. The result is a portable folder (vlc.exe and its
# plugins) uploaded as a zip artifact of the workflow run.

name: Windows build

# NOTE: "Run workflow" (workflow_dispatch) is only offered by GitHub when
#       the workflow is on the default branch, so every push builds
on:
  workflow_dispatch:
  push:
    branches: [redesign]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Image of the upstream "win64" job (extras/ci/gitlab-ci.yml), the
  # prebuilt contribs of that job are built with it
  VLC_WIN64_IMAGE: registry.videolan.org/vlc-debian-win64-posix:20260611225331
  TRIPLET: x86_64-w64-mingw32

jobs:
  win64:
    name: win64 (Qt)
    runs-on: ubuntu-latest
    # Without prebuilt contribs (Qt included), the contribs are built from
    # source, which can take several hours
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # the contrib revision is looked up in the history
          fetch-depth: 0

      - name: Find the prebuilt contribs
        run: |
          VLC_CONTRIB_SHA="$(extras/ci/get-contrib-sha.sh win64)"
          URL="https://artifacts.videolan.org/vlc/win64/vlc-contrib-${TRIPLET}-${VLC_CONTRIB_SHA}.tar.zst"
          if extras/ci/check-url.sh "$URL"; then
            echo "Using the prebuilt contribs of ${VLC_CONTRIB_SHA}"
            echo "VLC_PREBUILT_CONTRIBS_URL=$URL" >> "$GITHUB_ENV"
          else
            echo "::warning::No prebuilt contribs for ${VLC_CONTRIB_SHA}, using the latest ones (or building them)"
          fi

      - name: Pull the build image
        run: docker pull "$VLC_WIN64_IMAGE"

      - name: Build
        run: |
          docker run --rm --user root \
            -e VLC_PREBUILT_CONTRIBS_URL \
            -v "$GITHUB_WORKSPACE:/build" -w /build \
            "$VLC_WIN64_IMAGE" \
            bash -c '
              set -e
              git config --global --add safe.directory /build
              # -p: prebuilt contribs, -l: translations, -o: portable folder
              extras/package/win32/build.sh -r -a x86_64 -p -l -o /build/vlc-redesign-win64
            '

      - name: Package
        run: |
          sudo chown -R "$(id -u):$(id -g)" vlc-redesign-win64
          ls vlc-redesign-win64
          test -f vlc-redesign-win64/vlc.exe
          # portable mode: the settings are stored next to vlc.exe, an
          # installed VLC keeps its own settings
          mkdir -p vlc-redesign-win64/portable
          cp doc/redesign/WINDOWS.md vlc-redesign-win64/README-redesign.md
          cd vlc-redesign-win64 && zip -qr9 ../vlc-redesign-win64.zip .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vlc-redesign-win64
          path: vlc-redesign-win64.zip
          if-no-files-found: error
          retention-days: 14
